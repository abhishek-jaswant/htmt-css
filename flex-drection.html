<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
           flex-direction: row; /*arrange items horizontally in row*/
            background-color: red;
            width: 100%;
            height: 100vh;
            gap: 10px;
             flex-direction: column;/*arrange items vertically in colum */
        }
        div{
            width: 100px;
            height: 100px;
            background-color: black;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
         <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
       
    </div>
</body>
</html>
