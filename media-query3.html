<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: aqua;
            padding: 10px;
        }
        .nav-brand{
            font-size:1.5rem;
            font-weight: bold;
        }

        #nav-list{
            display: flex;
         list-style: none;
            align-items: center;
            gap: 10px;
        }
        #nav-list a{
            color: black;
            text-decoration: none;
        }

        .humburger{
            display: none;
            background:none;
            border:none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        @media (min-width:1024px){
            nav{
                flex-direction: row;
                
                
            }
           
        }

        @media (min-width:768px) and (max-width:1023px){
            nav{
                flex-direction: column;
               
                gap: 1rem;
            }
            #nav-list {
    flex-direction: column; /* Stack items vertically */
    align-items: center;    /* Center each item */
    width: 100%;
  }
            }

            @media (max-width:768px){
                .hamburger{
                    display: block;
                }
                #nav-list{
                    display: none;
                    flex-direction: column;
                    align-items: center;
                    width: 100%;
                    padding-top: 10px;
                }
            }
        
    </style>
</head>
<body>
   
        <nav>
            <div class="nav-brand">MyLogo</div>
       
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
                &#9776; <!-- Simple hamburger icon -->
            </button>

            <ul id="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
    
</body>
</html>
