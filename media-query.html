<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
           
            display: grid;
            gap:10px;
            height: 150vh;
            width: 100%;

        }
        div{
            width: 100px;
            width: 100px;
            background-color: aqua;
        }
        @media (min-width:768px){
            #container{
               
                grid-template-columns: repeat(2, 1fr);
            }
            div{
               
                background-color: red;
            }
        }
         @media (min-width:1024px){
            #container{
              
                grid-template-columns: repeat(3, 1fr);
            }
            div{
               
                
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <main id="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
        <div>13</div>
        <div>14</div>
        <div>15</div>
        <div>16</div>
        <div>17</div>
        <div>18</div>
        <div>19</div>
        <div>20</div>
        <div>21</div>
        <div>22</div>
        <div>23</div>
        <div>24</div>
        <div>25</div>
        <div>26</div>
        <div>27</div>
        <div>28</div>
        <div>29</div>
    </main>
</body>
</html>
