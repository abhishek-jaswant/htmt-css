<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
          height: 400px;
           width: 80%;
            background-color:  #be95be;
            color: white;
            gap: 20px;
           
           
        }
        .container > div{
            border: 2px solid black;
            display: flex;
             justify-content: center;
            align-items: center;
            font-size: 25px;
           
        }
     .container > div:nth-of-type(1){
           /* grid-area: 1 / 1 / 2 / 3; */
           grid-column: 1/ span 2;
           background:  linear-gradient(to right, #f9431e 0%, #f9431e 100%)
        }   
      
        .container > div:nth-of-type(2){
            grid-area: 1/ 3 / 3 / 4;
             background:linear-gradient(to right, #fbc6cc 0%, #fbc6cc 100%);
          
        }
          
        .container >div:nth-of-type(3){
            grid-area: 2 / 1 / 3 / 2; 
             background:linear-gradient(to right, #010dff 0%, #010dff 100%)
           
        } 
      
        .container >div:nth-of-type(4){
            grid-area: 2 / 2 / 3 / 3; 
            background:linear-gradient(to right, #a03d2d 0%, #a03d2d 100%)

        }
           
    </style>
</head>
<body>
   <div class="container">
    <div>4</div>
    <div>6</div>
    <div>1</div>
    <div>5</div>
   
   </div> 
</body>
</html>
