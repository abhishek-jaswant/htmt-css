<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Navbar</title>
    <style>
    .navbar {
    display: flex;
    justify-content: space-between;
    justify-content: center;
    background-color: #333;
    padding: 10px;
    }
    
    .logo {
    color: white;
    font-size: 50px;
    margin-right: auto;
    padding: 30px;
  
    }
    
    .links {
    display: flex;
    flex-direction: row;
    font-size: 50px;
     padding: 30px;
    gap: 10px;
    }
    
    .links a {
    text-decoration: none;
    color: white;
    padding: 5px 10px;
    }
    </style>

</head>

<body>
    <div class="navbar">
        <div class="logo">Logo</div>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>

</html>
