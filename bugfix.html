<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
* {
margin: 0;
padding: 0;
}

.container {
display: flex;
flex-wrap: wrap;
margin: 10px;
gap: 10px;
padding: 10px;
border: 1px solid black;
width: 100%;

background-color: lightblue;

}
 


.box {
width: 100px;
height: 100px;
background: white;
border: 1px solid black;
display: flex;
position: static;

align-items: center;
justify-content: center;

}

.text {
position: static;


font-weight: bold;

}
@media (max-width: 480px) {
    .container {
        justify-content: center; /* Centers boxes on narrow mobile screens */
    }
}
</style>

<body>
    <h1>Debugging Task</h1>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
    <p class="text">Fix my position!</p>
</body>

</html>
